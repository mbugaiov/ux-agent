# UX project — created by scripts/new_project.sh
# NEVER put real credentials here.

name: "<Project Name>"
slug: "<slug>"
base_url: https://staging.example.com

environment:
  type: staging
  notes: >
    Prefer local npm run dev for visual preview. STG reflects main only.

app:
  # Absolute or relative path to the product git root
  repo_path: ../../path/to/app
  default_branch: main
  # All UX redesign commits go here until reviewed
  pilot_branch: feat/ux-impeccable-pilot
  gate_command: npm run gate:mr

impeccable:
  enabled: true
  # surfaces relative to app repo_path
  default_scan_paths:
    - components/
    - app/
  # Prefer these Impeccable commands on mature product UIs
  preferred_commands:
    - audit
    - polish
    - harden
    - critique
  # Avoid on established dashboards unless explicitly requested
  avoid_commands:
    - craft
    - overdrive
    - delight

jira:
  enabled: false
  # Set epic_key in the live projects/<slug>/project.yaml (not in engine docs).
  # epic_key: <ATHENA-UX-EPIC>
  # hephaestus_handoff_label: impl-dev
  default_labels:
    - ux-agent
    - impl-ux

report:
  app_name: "<App>"
