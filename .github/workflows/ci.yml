name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Engine self-tests
        run: bash tests/run_tests.sh
      - name: Portability check
        run: bash scripts/portability_check.sh
      - name: Projects isolation check
        run: bash scripts/projects_isolation_check.sh
      - name: Review gate fixtures
        run: bash scripts/check_review_gate_fixtures.sh
